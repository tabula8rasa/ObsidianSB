# Лаборатория: два независимых RustFS в одной сети Compose.
# Не заменяйте этим файлом конфигурацию уже работающего RustFS.
name: rustfs-tier-lab
services:
  rustfs-hot:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${HOT_ACCESS:?Set HOT_ACCESS in .env}
      RUSTFS_SECRET_KEY: ${HOT_SECRET:?Set HOT_SECRET in .env}
    ports:
      - "127.0.0.1:9200:9000" # S3 API, горячий
      - "127.0.0.1:9201:9001" # Console, горячий
    volumes:
      - hot-data:/data
    networks:
      - tiers

  rustfs-cold:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${COLD_ACCESS:?Set COLD_ACCESS in .env}
      RUSTFS_SECRET_KEY: ${COLD_SECRET:?Set COLD_SECRET in .env}
    ports:
      - "127.0.0.1:9300:9000" # S3 API, холодный
      - "127.0.0.1:9301:9001" # Console, холодный
    volumes:
      - cold-data:/data
    networks:
      - tiers

networks:
  tiers:

volumes:
  hot-data:
  cold-data:
