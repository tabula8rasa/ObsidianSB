# СГЕНЕРИРОВАНО generate.py — не редактируй вручную, меняй параметры генератора.
# 2 кластера x 2 pool x 3 erasure set x 8 endpoint = 96 контейнеров RustFS
name: lesson27

x-a-env: &a-env
  RUSTFS_VOLUMES: "http://a1-n{1...24}:9000/data http://a2-n{1...24}:9000/data"
  RUSTFS_ADDRESS: ":9000"
  RUSTFS_CONSOLE_ADDRESS: ":9001"
  RUSTFS_CONSOLE_ENABLE: "false"
  RUSTFS_ACCESS_KEY: ${A_ACCESS_KEY:?set in .env}
  RUSTFS_SECRET_KEY: ${A_SECRET_KEY:?set in .env}
  RUSTFS_ERASURE_SET_DRIVE_COUNT: "8"
  RUSTFS_OBS_LOGGER_LEVEL: "info"
  RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"

x-b-env: &b-env
  RUSTFS_VOLUMES: "http://b1-n{1...24}:9000/data http://b2-n{1...24}:9000/data"
  RUSTFS_ADDRESS: ":9000"
  RUSTFS_CONSOLE_ADDRESS: ":9001"
