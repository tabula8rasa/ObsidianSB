# docker-compose.yml

x-mongod-common: &mongod-common
  image: mongo:8
  restart: unless-stopped
  networks: [mongo-cluster]
  depends_on:
    keyfile-init:
      condition: service_completed_successfully


services:

  # ============================================================
  # KEYFILE
  # ============================================================

  keyfile-init:
    image: mongo:8
    user: root

    entrypoint:
      - /bin/sh
      - -ec
      - |
        cp /keyfile-src/mongo-keyfile /keyfile/mongo-keyfile

        chown "$(id -u mongodb):$(id -g mongodb)" \
          /keyfile/mongo-keyfile

        chmod 0400 /keyfile/mongo-keyfile

        test -s /keyfile/mongo-keyfile

        echo "keyfile ready"

    volumes:
      - ./secrets/mongo-keyfile:/keyfile-src/mongo-keyfile:ro
      - mongo_keyfile:/keyfile

    restart: "no"


  # ============================================================
  # CONFIG SERVER REPLICA SET
  # ============================================================

  configsvr1:
    <<: *mongod-common

    command:
      mongod
      --configsvr
      --replSet configrs
      --port 27019
      --bind_ip_all
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro
      - configsvr1_data:/data/configdb

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27019",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  configsvr2:
    <<: *mongod-common

    command:
      mongod
      --configsvr
      --replSet configrs
      --port 27019
      --bind_ip_all
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro
      - configsvr2_data:/data/configdb

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27019",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  configsvr3:
    <<: *mongod-common

    command:
      mongod
      --configsvr
      --replSet configrs
      --port 27019
      --bind_ip_all
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro
      - configsvr3_data:/data/configdb

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27019",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  # ============================================================
  # CONFIG RS BOOTSTRAP
  #
  # Делит network namespace с configsvr1.
  # Поэтому 127.0.0.1:27019 == configsvr1:27019
  # ============================================================

  init-configrs:
    image: mongo:8

    network_mode: "service:configsvr1"

    depends_on:
      configsvr1:
        condition: service_healthy
      configsvr2:
        condition: service_healthy
      configsvr3:
        condition: service_healthy

    volumes:
      - bootstrap_state:/bootstrap

    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -f /bootstrap/configrs.done ]; then
          echo "configrs already initialized"
          exit 0
        fi

        echo "Initializing configrs..."

        mongosh \
          --quiet \
          --host 127.0.0.1 \
          --port 27019 \
          --eval '
            try {
              rs.status();
              print("configrs already exists");
            } catch (e) {
              if (e.codeName !== "NotYetInitialized") {
                throw e;
              }

              printjson(
                rs.initiate({
                  _id: "configrs",
                  configsvr: true,
                  members: [
                    {
                      _id: 0,
                      host: "configsvr1:27019"
                    },
                    {
                      _id: 1,
                      host: "configsvr2:27019"
                    },
                    {
                      _id: 2,
                      host: "configsvr3:27019"
                    }
                  ]
                })
              );
            }

            while (true) {
              try {
                const s = rs.status();

                if (
                  s.members &&
                  s.members.some(
                    m => m.stateStr === "PRIMARY"
                  )
                ) {
                  print("configrs PRIMARY ready");
                  break;
                }
              } catch (e) {}

              sleep(1000);
            }
          '

        touch /bootstrap/configrs.done

        echo "configrs initialized"

    restart: "no"


  # ============================================================
  # SHARD 1
  # ============================================================

  shard1a:
    <<: *mongod-common

    command:
      mongod
      --shardsvr
      --replSet shard1rs
      --port 27018
      --bind_ip_all
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro
      - shard1a_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27018",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  shard1b:
    <<: *mongod-common

    command:
      mongod
      --shardsvr
      --replSet shard1rs
      --port 27018
      --bind_ip_all
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro
      - shard1b_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27018",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  shard1c:
    <<: *mongod-common

    command:
      mongod
      --shardsvr
      --replSet shard1rs
      --port 27018
      --bind_ip_all
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro
      - shard1c_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27018",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  init-shard1:
    image: mongo:8

    network_mode: "service:shard1a"

    depends_on:
      shard1a:
        condition: service_healthy
      shard1b:
        condition: service_healthy
      shard1c:
        condition: service_healthy

    volumes:
      - bootstrap_state:/bootstrap

    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -f /bootstrap/shard1rs.done ]; then
          echo "shard1rs already initialized"
          exit 0
        fi

        echo "Initializing shard1rs..."

        mongosh \
          --quiet \
          --host 127.0.0.1 \
          --port 27018 \
          --eval '
            try {
              rs.status();
              print("shard1rs already exists");
            } catch (e) {
              if (e.codeName !== "NotYetInitialized") {
                throw e;
              }

              printjson(
                rs.initiate({
                  _id: "shard1rs",
                  members: [
                    {
                      _id: 0,
                      host: "shard1a:27018"
                    },
                    {
                      _id: 1,
                      host: "shard1b:27018"
                    },
                    {
                      _id: 2,
                      host: "shard1c:27018"
                    }
                  ]
                })
              );
            }

            while (true) {
              try {
                const s = rs.status();

                if (
                  s.members &&
                  s.members.some(
                    m => m.stateStr === "PRIMARY"
                  )
                ) {
                  print("shard1rs PRIMARY ready");
                  break;
                }
              } catch (e) {}

              sleep(1000);
            }
          '

        touch /bootstrap/shard1rs.done

        echo "shard1rs initialized"

    restart: "no"


  # ============================================================
  # SHARD 2
  # ============================================================

  shard2a:
    <<: *mongod-common

    command:
      mongod
      --shardsvr
      --replSet shard2rs
      --port 27018
      --bind_ip_all
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro
      - shard2a_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27018",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  shard2b:
    <<: *mongod-common

    command:
      mongod
      --shardsvr
      --replSet shard2rs
      --port 27018
      --bind_ip_all
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro
      - shard2b_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27018",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  shard2c:
    <<: *mongod-common

    command:
      mongod
      --shardsvr
      --replSet shard2rs
      --port 27018
      --bind_ip_all
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro
      - shard2c_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27018",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  init-shard2:
    image: mongo:8

    network_mode: "service:shard2a"

    depends_on:
      shard2a:
        condition: service_healthy
      shard2b:
        condition: service_healthy
      shard2c:
        condition: service_healthy

    volumes:
      - bootstrap_state:/bootstrap

    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -f /bootstrap/shard2rs.done ]; then
          echo "shard2rs already initialized"
          exit 0
        fi

        echo "Initializing shard2rs..."

        mongosh \
          --quiet \
          --host 127.0.0.1 \
          --port 27018 \
          --eval '
            try {
              rs.status();
              print("shard2rs already exists");
            } catch (e) {
              if (e.codeName !== "NotYetInitialized") {
                throw e;
              }

              printjson(
                rs.initiate({
                  _id: "shard2rs",
                  members: [
                    {
                      _id: 0,
                      host: "shard2a:27018"
                    },
                    {
                      _id: 1,
                      host: "shard2b:27018"
                    },
                    {
                      _id: 2,
                      host: "shard2c:27018"
                    }
                  ]
                })
              );
            }

            while (true) {
              try {
                const s = rs.status();

                if (
                  s.members &&
                  s.members.some(
                    m => m.stateStr === "PRIMARY"
                  )
                ) {
                  print("shard2rs PRIMARY ready");
                  break;
                }
              } catch (e) {}

              sleep(1000);
            }
          '

        touch /bootstrap/shard2rs.done

        echo "shard2rs initialized"

    restart: "no"


  # ============================================================
  # MONGOS 1
  # ============================================================

  mongos1:
    image: mongo:8

    restart: unless-stopped

    networks:
      - mongo-cluster

    command:
      mongos
      --configdb configrs/configsvr1:27019,configsvr2:27019,configsvr3:27019
      --bind_ip_all
      --port 27017
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro

    ports:
      - "127.0.0.1:27017:27017"

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27017",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    depends_on:
      init-configrs:
        condition: service_completed_successfully

      init-shard1:
        condition: service_completed_successfully

      init-shard2:
        condition: service_completed_successfully


  # ============================================================
  # MONGOS 2
  # ============================================================

  mongos2:
    image: mongo:8

    restart: unless-stopped

    networks:
      - mongo-cluster

    command:
      mongos
      --configdb configrs/configsvr1:27019,configsvr2:27019,configsvr3:27019
      --bind_ip_all
      --port 27017
      --keyFile /etc/mongo-keyfile-dir/mongo-keyfile

    volumes:
      - mongo_keyfile:/etc/mongo-keyfile-dir:ro

    ports:
      - "127.0.0.1:27018:27017"

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host", "127.0.0.1",
          "--port", "27017",
          "--eval", "db.adminCommand({ping:1}).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    depends_on:
      mongos1:
        condition: service_healthy


  # ============================================================
  # FINAL CLUSTER INITIALIZATION
  #
  # addShard + создание admin
  # ============================================================

  init-cluster:
    image: mongo:8

    network_mode: "service:mongos1"

    environment:
      MONGO_ADMIN_USER: ${MONGO_ADMIN_USER:-admin}
      MONGO_ADMIN_PASSWORD: ${MONGO_ADMIN_PASSWORD:-admin}

    volumes:
      - bootstrap_state:/bootstrap

    depends_on:
      mongos1:
        condition: service_healthy

      mongos2:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -f /bootstrap/cluster.done ]; then
          echo "cluster already initialized"
          exit 0
        fi

        echo "Adding shard1..."

        mongosh \
          --quiet \
          --host 127.0.0.1 \
          --port 27017 \
          --eval '
            const result = db.adminCommand({
              addShard:
                "shard1rs/shard1a:27018,shard1b:27018,shard1c:27018",
              name: "shard1"
            });

            printjson(result);

            if (!result.ok) {
              quit(1);
            }
          '

        echo "Adding shard2..."

        mongosh \
          --quiet \
          --host 127.0.0.1 \
          --port 27017 \
          --eval '
            const result = db.adminCommand({
              addShard:
                "shard2rs/shard2a:27018,shard2b:27018,shard2c:27018",
              name: "shard2"
            });

            printjson(result);

            if (!result.ok) {
              quit(1);
            }
          '

        echo "Creating cluster administrator..."

        mongosh \
          --quiet \
          --host 127.0.0.1 \
          --port 27017 \
          --eval '
            const admin = db.getSiblingDB("admin");

            admin.createUser({
              user: process.env.MONGO_ADMIN_USER,
              pwd: process.env.MONGO_ADMIN_PASSWORD,
              roles: [
                {
                  role: "root",
                  db: "admin"
                }
              ]
            });

            print("admin user created");
          '

        touch /bootstrap/cluster.done

        echo "MongoDB cluster initialized successfully"

    restart: "no"


# ============================================================
# NETWORK
# ============================================================

networks:
  mongo-cluster:
    driver: bridge


# ============================================================
# VOLUMES
# ============================================================

volumes:

  mongo_keyfile:

  bootstrap_state:

  configsvr1_data:
  configsvr2_data:
  configsvr3_data:

  shard1a_data:
  shard1b_data:
  shard1c_data:

  shard2a_data:
  shard2b_data:
  shard2c_data:
