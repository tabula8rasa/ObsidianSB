[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grpc-advanced-async-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.70",
    "grpcio-tools>=1.70",
    "protobuf>=5",
]

[project.scripts]
grpc-server = "app.server:main"
grpc-client = "app.client:main"

[tool.setuptools.packages.find]
where = ["src"]
